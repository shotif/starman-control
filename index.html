<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04060b" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Starman Control: a 4X strategy game of exploration, colonies and first contact among real nearby stars, in the Starman Reborn universe." />
    <meta name="application-name" content="Starman Control" />
    <title>Starman Control</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Starman Control" />
  </head>
  <body>
    <!-- The boot screen (FIRST_IMPRESSION.md §5): the game's own look before any script runs. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        background: radial-gradient(ellipse at 50% 120%, #0d1a33 0%, #04060b 62%);
        color: #e8eef8;
        font-family: "Saira Condensed", system-ui, sans-serif;
        text-transform: uppercase;
        transition: opacity 0.5s ease;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot .boot-starman {
        margin-right: -0.6em;
        color: #cfe0f5;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.6em;
      }
      #boot .boot-control {
        margin: -10px -0.1em 0 0;
        color: #dcf4ff;
        font-size: 44px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-shadow: 0 0 22px rgba(92, 200, 255, 0.5);
      }
      #boot .boot-line {
        position: relative;
        width: 160px;
        height: 1px;
        overflow: hidden;
        background: rgba(126, 170, 255, 0.2);
      }
      #boot .boot-line::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        background: linear-gradient(90deg, transparent, #5cc8ff, transparent);
        animation: boot-run 1.2s ease-in-out infinite;
      }
      @keyframes boot-run {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-line::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
    <div id="boot" aria-hidden="true">
      <div class="boot-starman">Starman</div>
      <div class="boot-control">Control</div>
      <div class="boot-line"></div>
    </div>
    <div id="app"></div>
    <noscript>
      <p style="color:#e8eef8;font-family:system-ui;padding:2rem">Starman Control needs JavaScript to run.</p>
    </noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
